services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elmsworth
      POSTGRES_PASSWORD: elmsworth
      POSTGRES_DB: elmsworth
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elmsworth -d elmsworth"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
